version: '3'

services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - 3023
    volumes:
      - ./public:/public
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.rwakanorwychat.rule=Host(`rettsai.rwaka.rw`)'
      - 'traefik.http.routers.rwakanorwychat.entrypoints=websecure'
      - 'traefik.http.routers.rwakanorwychat.tls.certResolver=letsencrypt'
      - 'traefik.http.services.rwakanorwychat.loadbalancer.server.port=3023'

networks:
  dokploy-network:
    external: true
