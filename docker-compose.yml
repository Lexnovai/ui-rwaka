version: '3'

services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - 3023
    volumes:
      - ./public:/public
    environment:
      - REDIS_URL=redis://default:${REDIS_PASSWORD}@redis:6379
      - FREE_REQUEST_LIMIT=10
    networks:
      - dokploy-network
    depends_on:
      - redis
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.rwakanorwychat.rule=Host(`ask.rettsai.no`)'
      - 'traefik.http.routers.rwakanorwychat.entrypoints=websecure'
      - 'traefik.http.routers.rwakanorwychat.tls.certResolver=letsencrypt'
      - 'traefik.http.services.rwakanorwychat.loadbalancer.server.port=3023'

  redis:
    image: redis:7-alpine
    container_name: rettsai-redis
    restart: always
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    networks:
      - dokploy-network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  dokploy-network:
    external: true

volumes:
  redis_data:
