version: '3'

services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - 3023
    volumes:
      - ./public:/public
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.lunaroot.rule=Host(`norway.rwaka.rw`)'
      - 'traefik.http.routers.lunaroot.entrypoints=websecure'
      - 'traefik.http.routers.lunaroot.tls.certResolver=letsencrypt'
      - 'traefik.http.services.lunaroot.loadbalancer.server.port=3023'

networks:
  dokploy-network:
    external: true
