version: '3'

services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - 3017
    volumes:
      - ./public:/public
    environment:
      - NEXT_PUBLIC_API_USERNAME=${NEXT_PUBLIC_API_USERNAME}
      - BACKEND_URL=${BACKEND_URL}
      - NEXT_PUBLIC_API_PASSWORD=${NEXT_PUBLIC_API_PASSWORD}
      - REDIS_URL=redis://default:${REDIS_PASSWORD}@redis:6379
      - FREE_REQUEST_LIMIT=10
    networks:
      - dokploy-network
    depends_on:
      - redis
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.rwakaaskchat.rule=Host(`ask.rwaka.rw`)'
      - 'traefik.http.routers.rwakaaskchat.entrypoints=websecure'
      - 'traefik.http.routers.rwakaaskchat.tls.certResolver=letsencrypt'
      - 'traefik.http.services.rwakaaskchat.loadbalancer.server.port=3017'

  redis:
    image: redis:7-alpine
    container_name: rwaka-redis
    restart: always
    ports:
      - '6799:6379'
    volumes:
      - redis_data:/data
    networks:
      - dokploy-network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command:
      [
        'sh',
        '-c',
        'redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"'
      ]
    healthcheck:
      test: ['CMD', 'sh', '-c', 'redis-cli -a "$REDIS_PASSWORD" ping']
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  dokploy-network:
    external: true

volumes:
  redis_data:
