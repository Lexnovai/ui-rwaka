version: '3'

services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - 3027
    volumes:
      - ./public:/public
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.rwakademo.rule=Host(`demo.rwaka.rw`)'
      - 'traefik.http.routers.rwakademo.entrypoints=websecure'
      - 'traefik.http.routers.rwakademo.tls.certResolver=letsencrypt'
      - 'traefik.http.services.rwakademo.loadbalancer.server.port=3027'

networks:
  dokploy-network:
    external: true
